<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin panel</title>
</head>
<style>
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background-color: #0b0b16;
        color: white;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }

    /* NAVBAR */
    nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 40px;
        background-color: #112;
        box-shadow: 0 4px 20px #404;
    }
    nav h2 {
        margin: 0;
        color: rgb(141, 141, 215);
    }
    nav div {
        display: flex;
        gap: 25px;
    }
    nav a {
        color: white;
        text-decoration: none;
    }
    nav a:hover {
        color: rgb(141, 141, 215);
    }

    /* MAIN */
    main {
        flex: 1;
        max-width: 1000px;
        width: 100%;
        margin: 0 auto;
        padding: 40px 20px;
    }
    h1 {
        text-align: center;
    }

    /* FORMALAR */
    .forms {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
        margin-bottom: 50px;
    }
    form {
        display: flex;
        flex-direction: column;
        gap: 15px;
        padding: 25px;
        background-color: #112;
        border-radius: 20px;
        box-shadow: 4px 10px 20px #404;
    }
    form h3 {
        margin: 0;
    }
    input {
        width: 250px;
        height: 40px;
        border-radius: 20px;
        border: none;
        padding-left: 1rem;
    }
    button {
        height: 45px;
        border-radius: 22px;
        border: none;
        background-color: rgb(91, 91, 165);
        color: white;
        font-size: 18px;
        transform: scale(1);
    }
    button:active {
        transition: 1ms all ease-in-out;
        transform: scale(0.9);
    }

    /* KINOLAR RO'YXATI */
    .list {
        max-width: 600px;
        margin: 0 auto;
    }
    .list h3 {
        text-align: center;
    }
    .row {
        display: flex;
        align-items: center;
        gap: 15px;
        padding: 10px 20px;
        margin-bottom: 10px;
        background-color: #112;
        border-radius: 15px;
    }
    .row img {
        width: 40px;
        height: 55px;
        object-fit: cover;
        border-radius: 8px;
    }
    .row b {
        color: rgb(141, 141, 215);
    }

    /* FOOTER */
    footer {
        padding: 20px;
        text-align: center;
        background-color: #112;
        color: #888;
    }
</style>
<body>
    <nav>
        <h2>🎬 Admin panel</h2>
        <div>
            <a href="/home">Kinolar</a>
            <a href="/">Chiqish</a>
        </div>
    </nav>

    <main>
        <h1>Kinolarni boshqarish</h1>

        <div class="forms">
            <!-- Yangi kino qo'shish -->
            <form action="/add-movie" method="post">
                <h3>Kino qo'shish</h3>
                <input type="text" name="id" placeholder="ID">
                <input type="text" name="title" placeholder="Kino nomi">
                <input type="text" name="subtitle" placeholder="Kino haqida">
                <input type="text" name="image" placeholder="Rasm URL manzili">
                <button type="submit">Qo'shish</button>
            </form>

            <!-- ID bo'yicha o'chirish -->
            <form action="/delete-movie" method="post">
                <h3>Kinoni o'chirish</h3>
                <input type="text" name="id" placeholder="ID">
                <button type="submit">O'chirish</button>
            </form>
        </div>

        <!-- Qaysi ID qaysi kino ekanini ko'rish uchun -->
        <div class="list">
            <h3>Bazadagi kinolar</h3>
            <div class="rows"></div>
        </div>
    </main>

    <footer>
        CoddyCamp · ExpressJS
    </footer>

    <script>
        // Serverdan kinolarni olamiz va ro'yxat qilib chiqaramiz
        async function showMovies() {
            const response = await fetch("/movies");
            const movies = await response.json();

            const rows = document.querySelector(".rows");
            rows.innerHTML = "";

            for (const movie of movies) {
                rows.innerHTML += `
                    <div class="row">
                        <img src="${movie.image}" alt="${movie.title}">
                        <b>ID: ${movie.id}</b>
                        <span>${movie.title}</span>
                    </div>
                `;
            }
        }

        showMovies();
    </script>
</body>
</html>
